<!DOCTYPE html>
	<html lang = "vi">
		<head>
			<meta charset = "UTF-8">
			<title> TRANG ĐĂNG KÝ </title>
			<link rel = "stylesheet" href = "../css/RegisterForm.css">
		</head>
		<body style = "margin:0px;">
			<div id = "Div-Form">
				<form id = "Login-Form">
					<div id = "Login-Form-Div">
						<h3 id ="Title-Form"> Đăng Ký </h3>
						<label for = "Username" id = "Username-Label"> Họ và tên </label>  <br>
						<input type = "text" id = "Username" name = "Username" class = "Form-control"> <br> <br>
						
						<label for = "Email" id = "Email-Label"> Email </label> <br>
						<input type = "email" id = "Email" name = "Email" class = "Form-control"> <br> <br>
						
						<label for = "QueQuan" id = "QueQuan-Label"> Quê Quán </label> <br>
						<input type = "text" id = "QueQuan" name - "QueQuan" class = "Form-control"> <br> <br>
						
						<label for = "Password" id = "Password-Label"> Mật Khẩu </label> <br>
						<input type = "password" id = "Password" name = "Password" class = "Form-control"> <br> <br>
						
						<label for ="ConfirmPassword" id = "ConfirmPassword"> Nhập lại mật khẩu </label> <br>
						<input type = "password" id = "ConfirmPassword" name = "ConfirmPassword" class = "Form-control"> <br> <br>
						
						<label for = "NgaySinh" id = "NgaySinh-Label"> Ngày sinh </label>
						<input type = "date" id = "NgaySinh" name = "NgaySinh" class = "Form-control"> <br> <br>
						
						<label for = "GioiTinh-Nam" id = "GioiTinhNam-Label"> Nam </label>
						<input type = "radio" id = "GioiTinh-Nam" name = "GioiTinh" value = "Nam" class = "Form-control-GioiTinh">
						
						<label for = "GioiTinh-Nu" id = "GioiTinhNu-Label"> Nữ </label>
						<input type = "radio" id = "GioiTinh-Nu" name = "GioiTinh" value = "Nu" class = "Form-control-GioiTinh"> <br>
						
						<input type = "submit" value = "Submit" name = "Sb-Login" id = "Submit-Input">
						<input type = "reset" value = "Reset" name = "Rs-Login" id = "Reset-Input">
					</div>
				</form>
			</div>
		</body>
	</html>
