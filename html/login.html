<!DOCTYPE html>
	<html lang = "vi">
		<head>
			<meta charset = "UTF-8">
			<title> TRANG ĐĂNG NHẬP </title>
			<link rel = "stylesheet" href = "../css/LoginForm.css">
		</head>
		<body style = "margin:0px;">
			<div id = "Div-Form">
				<form id = "Login-Form">
					<div id = "Login-Form-Div">
						<h3 id ="Title-Form"> Đăng Nhập </h3>
						<label for = "Username" id = "Username-Label"> Username </label>  <br>
						<input type = "text" id = "Username" name = "Username" class = "Form-control"> <br>
						<label for = "Password" id = "Password-Label"> Password </label> <br>
						<input type = "password" id = "Password" name = "Password" class = "Form-control"> <br> <br>
						<input type = "submit" value = "Submit" name = "Sb-Login" id = "Submit-Input">
						<input type = "reset" value = "Reset" name = "Rs-Login" id = "Reset-Input">
						<p id = "Register-Form"> Lần đầu đăng nhập ? <a href = "register.html"> Đăng ký </a> </p>
					</div>
				</form>
			</div>
		</body>
	</html>
